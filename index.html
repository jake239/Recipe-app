<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Recetario</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Refined warm earthy palette */
  --bg: #100e0b;
  --surface: #1c1814;
  --card: #242018;
  --card2: #2c271e;
  --accent: #d4922a;
  --accent-light: #e8b04a;
  --accent2: #b54e1e;
  --text: #f2e8d5;
  --text2: #c8b99a;
  --muted: #7a6e5e;
  --border: #332d23;
  --border2: #3e3628;
  --danger: #c04040;
  --green: #4a9e6e;
  --blue: #4a90d9;
  --glass-bg: rgba(36, 32, 24, 0.6);
  --glass-border: rgba(212, 146, 42, 0.15);
  --glass-highlight: rgba(255, 240, 200, 0.04);
}

/* ── AMBIENT BACKGROUND ── */
body::before {
content: ‘’;
position: fixed;
inset: 0;
background:
radial-gradient(ellipse at 15% 10%, rgba(212,146,42,0.09) 0%, transparent 50%),
radial-gradient(ellipse at 85% 85%, rgba(181,78,30,0.07) 0%, transparent 50%),
radial-gradient(ellipse at 50% 40%, rgba(74,158,110,0.03) 0%, transparent 55%);
pointer-events: none;
z-index: 0;
}

/* ── GLASSMORPHISM ── */
.glass {
background: var(–glass-bg) !important;
backdrop-filter: blur(16px) saturate(1.4);
-webkit-backdrop-filter: blur(16px) saturate(1.4);
border: 1px solid var(–glass-border) !important;
box-shadow: 0 4px 24px rgba(0,0,0,0.3), inset 0 1px 0 var(–glass-highlight);
}

- { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

button, .recipe-card, .tab, .emoji-btn, .nav-btn, .shop-check, .ing-check,
.pantry-filter, .cook-step, .share-opt, .star, .btn, .back-btn, .servings-btn,
.unit-btn, .add-to-shop, .parse-btn, .pantry-filter, .shop-delete, .step-item {
transition: transform 0.12s cubic-bezier(0.34,1.56,0.64,1), opacity 0.1s ease, background 0.15s ease;
}

button:active, .tab:active, .emoji-btn:active, .nav-btn:active, .share-opt:active,
.back-btn:active, .servings-btn:active, .unit-btn:active, .parse-btn:active,
.pantry-filter:active, .star:active, .add-to-shop:active {
transform: scale(0.88);
opacity: 0.7;
}

.btn:active { transform: scale(0.95); opacity: 0.85; }

.ing-check:active, .shop-check:active { transform: scale(0.8); }
.nav-btn:active { transform: none; }

/* Ripple effect */
.ripple-host { position: relative; overflow: hidden; }
@keyframes ripple {
from { transform: scale(0); opacity: 0.4; }
to   { transform: scale(4); opacity: 0; }
}
.ripple {
position: absolute; border-radius: 50%;
width: 60px; height: 60px;
background: rgba(232,168,56,0.35);
pointer-events: none;
animation: ripple 0.5s ease-out forwards;
transform-origin: center;
}

/* Nav active glow */
.nav-btn.active .icon { filter: drop-shadow(0 0 6px var(–accent)); }

/* Toast bounce */
@keyframes toastIn {
0%   { transform: translateX(-50%) translateY(20px); opacity: 0; }
60%  { transform: translateX(-50%) translateY(-4px); opacity: 1; }
100% { transform: translateX(-50%) translateY(0); opacity: 1; }
}
.toast.show { animation: toastIn 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards; }

/* Card hover shimmer */
@keyframes cardPop {
0%   { transform: scale(1); }
50%  { transform: scale(0.94); }
100% { transform: scale(1); }
}

/* Check bounce */
@keyframes checkBounce {
0%   { transform: scale(0.5); }
70%  { transform: scale(1.2); }
100% { transform: scale(1); }
}
.ing-check.checked, .shop-check.checked { animation: checkBounce 0.25s cubic-bezier(0.34,1.56,0.64,1); }

/* Star pop */
@keyframes starPop {
0%   { transform: scale(1); }
50%  { transform: scale(1.4); }
100% { transform: scale(1); }
}
.star.lit { animation: starPop 0.2s ease; }
body { font-family: ‘DM Sans’, sans-serif; background: var(–bg); color: var(–text); min-height: 100vh; display: flex; flex-direction: column; }
#app-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* HEADER */
header { background: rgba(28,24,20,0.85); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); border-bottom: 1px solid rgba(212,146,42,0.12); padding: 16px 20px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,240,200,0.04); flex-shrink: 0; }
.logo { font-family: ‘Playfair Display’, serif; font-size: 24px; color: var(–accent-light); letter-spacing: -0.3px; }
.logo span { font-style: italic; color: var(–text2); }
.header-actions { display: flex; gap: 8px; }
.icon-btn { background: none; border: none; color: var(–muted); font-size: 20px; cursor: pointer; padding: 4px; }

/* SEARCH */
.search-bar { padding: 10px 16px; background: rgba(26,24,20,0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(232,168,56,0.08); }
.search-bar input { width: 100%; background: var(–card); border: 1px solid var(–border); border-radius: 12px; padding: 9px 14px; color: var(–text); font-family: ‘DM Sans’, sans-serif; font-size: 15px; outline: none; }
.search-bar input:focus { border-color: var(–accent); }
.search-bar input::placeholder { color: var(–muted); }

/* TABS */
.tabs { display: flex; padding: 10px 16px; gap: 8px; overflow-x: auto; background: rgba(26,24,20,0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(232,168,56,0.08); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 5px 13px; border-radius: 20px; border: 1px solid var(–border); background: transparent; color: var(–muted); font-family: ‘DM Sans’, sans-serif; font-size: 12px; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
.tab.active { background: linear-gradient(135deg, var(–accent-light), var(–accent)); color: var(–bg); border-color: var(–accent); font-weight: 600; box-shadow: 0 2px 12px rgba(212,146,42,0.3); }

/* VIEWS */
.view { display: none; }
.view.active { display: block; }

/* RECIPE GRID */
.recipe-grid { padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.recipe-card { background: rgba(36,32,24,0.75); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,240,200,0.06); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; position: relative; box-shadow: 0 4px 24px rgba(0,0,0,0.35), 0 1px 0 rgba(255,255,255,0.04) inset; }

@keyframes cardBounce {
0%   { transform: scale(1); }
30%  { transform: scale(0.93); }
60%  { transform: scale(1.04); }
80%  { transform: scale(0.98); }
100% { transform: scale(1); }
}
.recipe-card.bouncing { animation: cardBounce 0.32s cubic-bezier(0.34,1.56,0.64,1) forwards; pointer-events: none; }
.recipe-card:active { transform: none; }
.recipe-card.fav { border-color: var(–accent); }
.recipe-card-emoji { height: 96px; display: flex; align-items: center; justify-content: center; font-size: 52px; background: linear-gradient(160deg, rgba(44,39,30,0.9) 0%, rgba(28,24,20,0.95) 100%); cursor: pointer; }
.recipe-card-emoji span { display: inline-block; transition: transform 0.1s; }

@keyframes emojiBounce {
0%   { transform: scale(1) translateY(0); }
15%  { transform: scale(0.8) translateY(6px); }
40%  { transform: scale(1.7) translateY(-18px); }
55%  { transform: scale(1.5) translateY(-12px); }
70%  { transform: scale(1.65) translateY(-16px); }
82%  { transform: scale(1.3) translateY(-6px); }
92%  { transform: scale(1.45) translateY(-10px); }
100% { transform: scale(1) translateY(0); }
}

@keyframes emojiShadowPulse {
0%   { text-shadow: none; }
40%  { text-shadow: 0 12px 24px rgba(0,0,0,0.5), 0 0 30px rgba(232,168,56,0.3); }
100% { text-shadow: none; }
}

.recipe-card-emoji.bouncing span {
animation: emojiBounce 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards,
emojiShadowPulse 0.6s ease forwards;
}
.recipe-card-info { padding: 10px 12px 14px; }
.recipe-card-title { font-family: ‘Playfair Display’, serif; font-size: 14px; line-height: 1.35; margin-bottom: 4px; color: var(–text); }
.recipe-card-meta { font-size: 11px; color: var(–text2); opacity: 0.7; }
.fav-star { position: absolute; top: 6px; right: 8px; font-size: 14px; }
.difficulty-badge { position: absolute; top: 6px; left: 8px; font-size: 10px; background: rgba(0,0,0,0.5); border-radius: 6px; padding: 2px 5px; color: var(–text); }

/* EMPTY */
.empty-state { text-align: center; padding: 50px 20px; color: var(–muted); grid-column: 1/-1; }
.empty-state .big { font-size: 48px; margin-bottom: 10px; }

/* FORM */
.form-container { padding: 12px 16px; }
.form-title { font-family: ‘Playfair Display’, serif; font-size: 18px; margin-bottom: 10px; color: var(–accent); }
.form-group { margin-bottom: 9px; }
label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(–text2); margin-bottom: 4px; font-weight: 600; opacity: 0.7; }
input, textarea, select { width: 100%; background: var(–card); border: 1px solid var(–border); border-radius: 10px; padding: 8px 12px; color: var(–text); font-family: ‘DM Sans’, sans-serif; font-size: 14px; outline: none; transition: border-color 0.15s; }
textarea#r-ingredients, textarea#r-steps {
background: #2a2620;
color: #f5ead8;
font-size: 15px;
line-height: 1.9;
padding: 12px 14px;
min-height: 160px;
border: 1px solid rgba(232,168,56,0.2);
letter-spacing: 0.01em;
}
textarea#r-ingredients:focus, textarea#r-steps:focus {
background: #302c27;
border-color: var(–accent);
box-shadow: 0 0 0 3px rgba(232,168,56,0.08);
}
textarea#r-notes {
background: #2a2620;
color: #f5ead8;
font-size: 14px;
line-height: 1.8;
padding: 10px 14px;
}
textarea#paste-raw {
background: #2a2620;
color: #f5ead8;
font-size: 14px;
line-height: 1.8;
padding: 10px 14px;
}
input:focus, textarea:focus, select:focus { border-color: var(–accent); }
textarea { min-height: 70px; resize: vertical; line-height: 1.8; }
select option { background: var(–card); }

.emoji-picker { margin-top: 8px; }
.emoji-search { width: 100%; margin-bottom: 8px; padding: 8px 12px; background: var(–card); border: 1px solid var(–border); border-radius: 10px; color: var(–text); font-family: ‘DM Sans’, sans-serif; font-size: 14px; outline: none; }
.emoji-search:focus { border-color: var(–accent); }
.emoji-category { margin-bottom: 10px; }
.emoji-category-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(–muted); margin-bottom: 6px; font-weight: 600; }
.emoji-row { display: flex; gap: 6px; flex-wrap: wrap; }
.emoji-btn { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(–border); background: var(–card); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.1s, border-color 0.15s; }
.emoji-btn:active { transform: scale(0.88); }
.emoji-btn.selected { border-color: var(–accent); background: rgba(232,168,56,0.1); }
.emoji-btn.hidden { display: none; }

.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

.auto-tag-row { display: flex; flex-wrap: nowrap; gap: 6px; margin-top: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.auto-tag-row::-webkit-scrollbar { display: none; }
.auto-tag { padding: 3px 9px; border-radius: 20px; background: var(–surface); border: 1px solid rgba(232,168,56,0.4); color: var(–muted); font-size: 12px; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
.auto-tag.selected { background: var(–accent); color: var(–bg); border-color: var(–accent); }

/* PASTE PARSER */
.paste-section { background: rgba(26,24,20,0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px dashed rgba(232,168,56,0.2); border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.03); }
.paste-section p { font-size: 13px; color: var(–muted); margin-bottom: 8px; }
.paste-section textarea { min-height: 70px; font-size: 13px; }
.parse-btn { margin-top: 8px; width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(–border); background: var(–card2); color: var(–text); font-family: ‘DM Sans’, sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; }

/* BUTTONS */
.btn { width: 100%; padding: 13px; border-radius: 12px; border: none; font-family: ‘DM Sans’, sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity 0.15s, transform 0.1s; }
.btn:active { transform: scale(0.98); opacity: 0.85; }
.btn-primary { background: linear-gradient(135deg, var(–accent-light) 0%, var(–accent) 100%); color: var(–bg); box-shadow: 0 4px 20px rgba(212,146,42,0.3); }
.btn-danger { background: var(–danger); color: white; margin-top: 8px; }
.btn-outline { background: transparent; color: var(–text); border: 1px solid var(–border); margin-top: 8px; }
.btn-green { background: var(–green); color: white; }

/* DETAIL */
.detail-header { padding: 16px 18px; border-bottom: 1px solid var(–border); }
.detail-emoji { font-size: 56px; margin-bottom: 10px; cursor: pointer; display: inline-block; }
.detail-emoji.bouncing { animation: emojiBounce 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards, emojiShadowPulse 0.6s ease forwards; }
.detail-title { font-family: ‘Playfair Display’, serif; font-size: 26px; margin-bottom: 8px; line-height: 1.2; cursor: pointer; border-bottom: 1px dashed transparent; transition: border-color 0.2s; color: var(–text); font-weight: 400; }
.detail-title:hover, .detail-title:active { border-bottom-color: rgba(232,168,56,0.4); }
.inline-edit-input { font-family: ‘Playfair Display’, serif; font-size: 22px; background: rgba(232,168,56,0.08); border: 1px solid var(–accent); border-radius: 8px; color: var(–text); padding: 4px 8px; width: 100%; outline: none; }
.inline-edit-ta { background: rgba(232,168,56,0.05); border: 1px solid rgba(232,168,56,0.3); border-radius: 8px; color: var(–text); padding: 8px; width: 100%; outline: none; font-family: ‘DM Sans’, sans-serif; font-size: 14px; line-height: 1.6; resize: vertical; min-height: 60px; }
.edit-hint { font-size: 10px; color: var(–muted); text-align: right; margin-top: 4px; }
.step-item { cursor: pointer; }
.step-item:active { background: rgba(232,168,56,0.05); border-radius: 8px; }
.detail-meta { font-size: 13px; color: var(–muted); display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.tag-pill { display: inline-block; padding: 3px 9px; border-radius: 20px; background: var(–surface); border: 1px solid var(–border); font-size: 11px; color: var(–muted); }
.difficulty-pill { border-color: var(–accent2); color: var(–accent2); }
.detail-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.detail-actions button { flex: 1; min-width: 70px; padding: 8px 6px; border-radius: 10px; border: 1px solid var(–border); background: var(–card); color: var(–text); font-family: ‘DM Sans’, sans-serif; font-size: 12px; cursor: pointer; }
.detail-actions button.active-btn { background: var(–accent); color: var(–bg); border-color: var(–accent); }

/* SECTION */
.detail-section { padding: 18px 20px; border-bottom: 1px solid var(–border); }
.section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(–accent); font-weight: 700; margin-bottom: 12px; }

/* SERVINGS + UNIT */
.servings-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.servings-control { display: flex; align-items: center; gap: 12px; }
.servings-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(–border); background: var(–card); color: var(–text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.servings-num { font-family: ‘Playfair Display’, serif; font-size: 20px; min-width: 26px; text-align: center; }
.unit-toggle { margin-left: auto; display: flex; border-radius: 8px; overflow: hidden; border: 1px solid var(–border); }
.unit-btn { padding: 5px 10px; background: transparent; border: none; color: var(–muted); font-family: ‘DM Sans’, sans-serif; font-size: 12px; cursor: pointer; }
.unit-btn.active { background: var(–accent); color: var(–bg); }

/* INGREDIENTS */
.ingredient-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(–border); font-size: 15px; color: var(–text); }
.ingredient-item:last-child { border-bottom: none; }
.ing-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(–border); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.ing-check.checked { background: var(–accent); border-color: var(–accent); color: var(–bg); font-size: 11px; }
.ingredient-item.checked-item .ing-text { text-decoration: line-through; color: var(–muted); }
.add-to-shop { margin-left: auto; font-size: 16px; cursor: pointer; padding: 2px 4px; }

/* STEPS */
.step-item { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(–border); cursor: pointer; transition: background 0.15s; border-radius: 8px; }
.step-item:last-child { border-bottom: none; }
.step-item.current-step { background: rgba(232,168,56,0.08); padding: 12px 8px; margin: 0 -8px; }
.step-num { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, var(–accent2), #8a3010); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 2px; box-shadow: 0 2px 8px rgba(181,78,30,0.4); }
.step-num.done { background: var(–green); }
.step-text { font-size: 15px; line-height: 1.7; flex: 1; color: var(–text); }
.step-timer-btn { margin-left: 4px; padding: 3px 8px; border-radius: 8px; background: var(–accent2); border: none; color: white; font-size: 11px; cursor: pointer; white-space: nowrap; }

/* SMART TIMERS */
.smart-timers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.smart-timer-chip { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 20px; background: rgba(196,92,38,0.15); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(196,92,38,0.4); font-size: 12px; cursor: pointer; box-shadow: 0 2px 8px rgba(196,92,38,0.15); }
.smart-timer-chip.running { border-color: var(–green); color: var(–green); }

/* COOK MODE */
#cook-view { background: var(–bg); }
.cook-header { padding: 14px 18px; border-bottom: 1px solid var(–border); display: flex; align-items: center; gap: 10px; }
.cook-title { font-family: ‘Playfair Display’, serif; font-size: 18px; flex: 1; }

/* TIMER */
.timer-section { padding: 14px 18px; border-bottom: 1px solid var(–border); }
.timer-display { font-family: ‘Playfair Display’, serif; font-size: 52px; text-align: center; color: var(–accent); margin: 8px 0; letter-spacing: 2px; }
.timer-display.warning { color: var(–danger); }
.timer-input-row { display: flex; gap: 8px; margin-bottom: 8px; }
.timer-input-row input { flex: 1; text-align: center; padding: 8px; font-size: 16px; }
.timer-controls { display: flex; gap: 8px; }
.timer-controls button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(–border); background: var(–card); color: var(–text); font-family: ‘DM Sans’, sans-serif; font-size: 14px; cursor: pointer; }
.timer-controls button.start { background: var(–accent); color: var(–bg); border-color: var(–accent); }

/* COOK STEPS */
.cook-step { padding: 12px; border-radius: 12px; border: 1px solid var(–border); margin-bottom: 8px; cursor: pointer; transition: all 0.15s; }
.cook-step.active-step { border-color: var(–accent); background: rgba(232,168,56,0.07); }
.cook-step.done-step { opacity: 0.5; }
.cook-step-num { font-size: 11px; color: var(–accent); font-weight: 600; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
.cook-step-text { font-size: 16px; line-height: 1.6; }

/* SHOPPING LIST */
.shop-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.shop-section-title { font-size: 10px; font-weight: 700; color: var(–accent); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.1em; }
.shop-item { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(–border); font-size: 15px; position: relative; overflow: hidden; touch-action: pan-y; }
.shop-item:last-child { border-bottom: none; }
.shop-item-inner { display: flex; align-items: center; gap: 12px; flex: 1; transition: transform 0.25s ease; }
.shop-check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(–border); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.shop-check.checked { background: var(–green); border-color: var(–green); color: white; font-size: 13px; }
.shop-item.bought .shop-text { text-decoration: line-through; color: var(–muted); opacity: 0.6; }
.shop-item-info { flex: 1; }
.shop-text { font-size: 15px; color: var(–text); line-height: 1.3; }
.shop-qty { font-size: 12px; color: var(–muted); margin-top: 1px; }
.shop-source { font-size: 11px; color: var(–accent); opacity: 0.7; margin-top: 1px; }
.shop-delete { margin-left: auto; background: none; border: none; color: var(–muted); font-size: 18px; cursor: pointer; padding: 4px 6px; flex-shrink: 0; }

/* Swipe to delete */
.shop-swipe-actions { position: absolute; right: 0; top: 0; bottom: 0; display: flex; transform: translateX(100%); transition: transform 0.25s ease; }
.shop-swipe-del { background: var(–danger); color: white; border: none; padding: 0 20px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: ‘DM Sans’, sans-serif; }
.shop-item.swiped .shop-item-inner { transform: translateX(-80px); }
.shop-item.swiped .shop-swipe-actions { transform: translateX(0); }

/* Aisle collapsible */
.shop-aisle-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 8px; cursor: pointer; border-bottom: 1px solid var(–border); margin-bottom: 2px; }
.shop-aisle-label { font-size: 10px; font-weight: 700; color: var(–accent); text-transform: uppercase; letter-spacing: 0.1em; }
.shop-aisle-meta { font-size: 11px; color: var(–muted); background: rgba(255,255,255,0.05); padding: 1px 7px; border-radius: 10px; }
.shop-aisle-chevron { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; background: rgba(212,146,42,0.15); border: 1px solid rgba(212,146,42,0.25); color: var(–accent); font-size: 11px; font-weight: 700; transition: transform 0.25s ease; }
.shop-aisle-chevron.collapsed { transform: rotate(-90deg); }
.shop-aisle-items { overflow: hidden; transition: max-height 0.3s ease, opacity 0.2s ease; max-height: 2000px; opacity: 1; }
.shop-aisle-items.collapsed { max-height: 0; opacity: 0; }

/* Shop header stats */
.shop-stats { display: flex; gap: 8px; margin-bottom: 14px; }
.shop-stat { flex: 1; background: var(–card); border-radius: 10px; padding: 10px; text-align: center; border: 1px solid var(–border); }
.shop-stat-num { font-family: ‘Playfair Display’, serif; font-size: 20px; color: var(–text); }
.shop-stat-label { font-size: 10px; color: var(–muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
.shop-add-row { display: flex; gap: 8px; margin-top: 10px; }
.shop-add-row input { flex: 1; }
.shop-add-row button { padding: 10px 14px; border-radius: 10px; border: none; background: var(–accent); color: var(–bg); font-family: ‘DM Sans’, sans-serif; font-weight: 500; cursor: pointer; }

/* NOTES */
.notes-area { background: var(–card); border: 1px solid var(–border); border-radius: 10px; padding: 12px; font-size: 14px; color: var(–text); line-height: 1.6; white-space: pre-wrap; }

/* BOTTOM NAV */
.bottom-nav { position: sticky; bottom: 0; background: rgba(22,19,14,0.97); backdrop-filter: blur(28px) saturate(1.8); -webkit-backdrop-filter: blur(28px) saturate(1.8); border-top: 1px solid rgba(212,146,42,0.12); display: flex; padding: 8px 0 28px; z-index: 9999; box-shadow: 0 -6px 40px rgba(0,0,0,0.5); flex-shrink: 0; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; background: none; border: none; color: var(–muted); font-family: ‘DM Sans’, sans-serif; font-size: 10px; cursor: pointer; padding: 3px 0; -webkit-user-select: none; user-select: none; position: relative; }
.nav-label { font-size: 9px; letter-spacing: 0.02em; }
.nav-btn.active { color: var(–accent-light); }
.nav-btn .icon { font-size: 20px; display: inline-block; transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), filter 0.15s ease; }
.nav-btn.active .icon { filter: drop-shadow(0 0 8px var(–accent)); }

/* Keyboard key popup bubble */
.nav-key-popup {
position: fixed;
background: #f0e6cc;
color: #1a1210;
border-radius: 18px;
padding: 14px 18px 10px;
font-size: 56px;
line-height: 1;
pointer-events: none;
box-shadow: 0 8px 30px rgba(0,0,0,0.6);
border: 1px solid rgba(0,0,0,0.1);
z-index: 9999;
opacity: 0;
transform: scale(0.5);
transition: opacity 0.12s ease, transform 0.18s cubic-bezier(0.34,1.56,0.64,1);
}
.nav-key-popup.show {
opacity: 1;
transform: scale(1);
}
.nav-key-popup.hide {
opacity: 0;
transform: scale(0.7);
transition: opacity 0.12s ease, transform 0.12s ease;
}

.back-btn { background: none; border: none; color: var(–accent); font-family: ‘DM Sans’, sans-serif; font-size: 14px; cursor: pointer; padding: 2px 0; display: flex; align-items: center; gap: 3px; }

/* SHARE SHEET */
.share-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: flex-end; }
.share-overlay.open { display: flex; }
.share-sheet { background: rgba(26,24,20,0.85); backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8); border-radius: 20px 20px 0 0; padding: 20px; width: 100%; border-top: 1px solid rgba(232,168,56,0.15); box-shadow: 0 -8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06); }
.share-title { font-family: ‘Playfair Display’, serif; font-size: 18px; margin-bottom: 14px; }
.share-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.share-opt { padding: 12px; border-radius: 12px; border: 1px solid var(–border); background: var(–card); color: var(–text); font-family: ‘DM Sans’, sans-serif; font-size: 13px; cursor: pointer; text-align: center; }
.share-cancel { width: 100%; margin-top: 10px; padding: 12px; border-radius: 12px; border: 1px solid var(–border); background: transparent; color: var(–muted); font-family: ‘DM Sans’, sans-serif; font-size: 14px; cursor: pointer; }

/* RATING */
.star-row { display: flex; gap: 4px; margin-top: 4px; }
.star { font-size: 20px; cursor: pointer; opacity: 0.3; }
.star.lit { opacity: 1; }

/* TOAST */
/* ── CONFETTI ── */
.confetti-dot {
position: fixed;
width: 8px; height: 8px;
border-radius: 50%;
pointer-events: none;
z-index: 9999;
}
@keyframes confettiFly {
0%   { transform: translate(0,0) scale(1) rotate(0deg); opacity: 1; }
100% { transform: translate(var(–cx), var(–cy)) scale(0) rotate(var(–cr)); opacity: 0; }
}

/* ── PROGRESS BAR ── */
.shop-progress-wrap {
margin-bottom: 12px;
background: var(–border);
border-radius: 20px;
height: 8px;
overflow: hidden;
}
.shop-progress-fill {
height: 100%;
border-radius: 20px;
background: linear-gradient(90deg, var(–accent), var(–green));
transition: width 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.shop-progress-label {
font-size: 11px;
color: var(–muted);
text-align: right;
margin-top: 4px;
margin-bottom: 10px;
}
.shop-progress-label.done {
color: var(–green);
font-weight: 600;
}

/* Cart badge */
.cart-icon-wrap { position: relative; display: inline-block; }
.cart-badge {
position: absolute; top: -6px; right: -8px;
background: var(–accent); color: var(–bg);
font-size: 10px; font-weight: 700; border-radius: 10px;
padding: 1px 5px; min-width: 16px; text-align: center; line-height: 1.4;
}
.cart-badge.pop { animation: badgePop 0.3s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes badgePop {
0% { transform: scale(1); } 50% { transform: scale(1.5); } 100% { transform: scale(1); }
}

.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #3d8a5e, #2d6e48); color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 500; z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.3); letter-spacing: 0.01em; }

/* Post-save shopping prompt */
.shop-prompt-overlay {
position: fixed; inset: 0; background: rgba(0,0,0,0.6);
z-index: 200; display: none; align-items: flex-end; justify-content: center;
}
.shop-prompt-overlay.open { display: flex; }
.shop-prompt-sheet {
background: rgba(26,24,20,0.95); backdrop-filter: blur(30px);
-webkit-backdrop-filter: blur(30px);
border-radius: 20px 20px 0 0; padding: 20px 20px 36px;
width: 100%; border-top: 1px solid rgba(232,168,56,0.2);
box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes slideUp {
from { transform: translateY(100%); }
to   { transform: translateY(0); }
}
.shop-prompt-title {
font-family: ‘Playfair Display’, serif; font-size: 18px;
margin-bottom: 4px; color: var(–text);
}
.shop-prompt-sub { font-size: 13px; color: var(–muted); margin-bottom: 16px; }
.shop-prompt-btns { display: flex; flex-direction: column; gap: 8px; }
.shop-prompt-btn {
width: 100%; padding: 13px; border-radius: 12px; border: none;
font-family: ‘DM Sans’, sans-serif; font-size: 15px; font-weight: 500;
cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px;
}
.shop-prompt-btn.all  { background: var(–accent); color: var(–bg); }
.shop-prompt-btn.skip { background: rgba(76,175,125,0.15); color: var(–green); border: 1px solid rgba(76,175,125,0.3); }
.shop-prompt-btn.no   { background: transparent; color: var(–muted); border: 1px solid var(–border); }
.toast.show { opacity: 1; }

/* PANTRY */
.pantry-item {
display: flex; align-items: center; gap:10px;
padding: 14px 8px 14px 12px;
border-bottom: 1px solid var(–border);
font-size: 15px; min-height: 52px;
position: relative;
border-left: 3px solid transparent;
border-radius: 4px;
transition: background 0.15s;
touch-action: pan-y;
overflow: hidden;
}
.pantry-item.status-ok  { border-left-color: var(–green); }
.pantry-item.status-low { border-left-color: var(–accent); }
.pantry-item.status-out { border-left-color: var(–danger); }

/* Swipe actions */
.pantry-item-inner { display: flex; align-items: center; gap:10px; flex:1; transition: transform 0.25s ease; }
.pantry-swipe-actions {
position: absolute; right: 0; top: 0; bottom: 0;
display: flex; align-items: center; gap: 0;
transform: translateX(100%);
transition: transform 0.25s ease;
}
.pantry-swipe-btn {
height: 100%; padding: 0 16px;
border: none; cursor: pointer;
font-size: 13px; font-weight: 600;
font-family: ‘DM Sans’, sans-serif;
display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.pantry-swipe-btn.restock { background: var(–green); color: white; }
.pantry-swipe-btn.low-btn { background: var(–accent); color: var(–bg); }
.pantry-swipe-btn.delete-btn { background: var(–danger); color: white; }
.pantry-item.swiped .pantry-item-inner { transform: translateX(-148px); }
.pantry-item.swiped .pantry-swipe-actions { transform: translateX(0); }

/* Inline edit */
.pantry-name-edit {
background: transparent; border: none; border-bottom: 1px solid var(–accent);
color: var(–text); font-family: ‘DM Sans’, sans-serif; font-size: 15px;
outline: none; width: 100%; padding: 2px 0;
}
